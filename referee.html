<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#020617">
<title>XURA | لوحة الحكام</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --teal:#5eead4;--teal-d:#0d9488;--teal-bg:#134e4a;
  --amber:#f59e0b;--amber-d:#d97706;
  --red:#f87171;--red-d:#dc2626;--red-bg:#450a0a;
  --green:#4ade80;--green-bg:#052e16;
  --bg:#020617;--surface:#0f172a;--surface2:#1e293b;--surface3:#0a1020;
  --muted:#475569;--faint:#334155;--text:#e2e8f0;--text2:#94a3b8;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans Arabic','Segoe UI',Tahoma,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto}

/* Topbar */
#topbar{padding:10px 14px;border-bottom:1px solid var(--surface2);display:flex;align-items:center;justify-content:space-between;background:#030918;flex-shrink:0}
#topbar h1{font-size:13px;font-weight:900;letter-spacing:.1em;color:var(--teal)}
.r-badge{font-size:10px;padding:3px 8px;border-radius:6px;background:var(--teal-bg);color:var(--teal);font-weight:700}

/* Screens */
#screens{flex:1;overflow-y:auto;overflow-x:hidden}
.screen{display:none;padding:12px 12px 20px;animation:sIn .2s ease}
.screen.active{display:block}
@keyframes sIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* Cards */
.card{background:var(--surface);border:1px solid var(--surface2);border-radius:13px;padding:14px;margin-bottom:10px}
.card-sm{background:var(--surface3);border:1px solid #0e1929;border-radius:10px;padding:10px;margin-bottom:8px}

/* Buttons */
.btn{padding:10px 16px;border-radius:11px;border:none;cursor:pointer;font-size:12px;font-family:inherit;font-weight:700;transition:transform .1s;touch-action:manipulation;color:#fff}
.btn:active{transform:scale(.94)}
.btn-primary{background:var(--teal-d)}
.btn-red{background:var(--red-d)}
.btn-amber{background:var(--amber-d)}
.btn-ghost{background:transparent;border:1px solid var(--surface2);color:var(--muted)}
.btn-full{width:100%;display:block;margin-top:8px}
.btn-sm{padding:5px 10px;font-size:10.5px;border-radius:8px}

/* Forms */
.fg{margin-bottom:10px}
.fl{font-size:10px;color:var(--muted);margin-bottom:3px;display:block;font-weight:700}
.fi{width:100%;background:var(--surface2);border:1px solid var(--faint);border-radius:8px;padding:9px 11px;color:var(--text);font-size:13px;font-family:inherit;outline:none}
.fi:focus{border-color:var(--teal-d)}

/* Hero */
.hero{background:linear-gradient(130deg,#0a2820,#050f1e);border:1px solid var(--teal-d);border-radius:15px;padding:20px;text-align:center;margin-bottom:14px}
.hero h2{font-size:16px;font-weight:900;color:var(--teal);margin-bottom:4px}
.hero p{font-size:10.5px;color:var(--muted)}

/* Score Board */
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:16px;background:var(--surface);border:1px solid var(--surface2);border-radius:13px;margin-bottom:10px}
.team-col{display:flex;flex-direction:column;align-items:center;gap:8px}
.team-name-lbl{font-size:11px;font-weight:800;text-align:center;line-height:1.3}
.score-num{font-size:64px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:var(--teal)}
.score-divider{color:var(--faint);font-size:18px;font-weight:200}
.add-btn{width:100%;padding:14px;border-radius:12px;border:2px solid;font-size:18px;font-weight:900;cursor:pointer;font-family:inherit;transition:transform .1s;touch-action:manipulation}
.add-btn:active{transform:scale(.9)}

/* Sets */
.sets-row{display:flex;justify-content:space-around;padding:10px;background:var(--surface3);border-radius:10px;margin-bottom:10px}
.set-box{text-align:center}
.set-num{font-size:22px;font-weight:900;color:var(--amber)}
.set-lbl{font-size:9px;color:var(--muted)}

/* Log */
.log-item{display:flex;justify-content:space-between;padding:5px 8px;border-bottom:1px solid #060d1a;font-size:10.5px}
.log-item:last-child{border-bottom:none}

/* Toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface2);color:var(--text);padding:6px 16px;border-radius:18px;font-size:11.5px;z-index:500;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;border:1px solid var(--faint);max-width:90%}

/* Sec title */
.sec-title{font-size:9.5px;font-weight:700;color:var(--faint);letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}

/* Match card */
.mc{background:var(--surface);border:1px solid var(--surface2);border-radius:11px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.mc:hover{border-color:var(--faint)}
.mc.pending{border-color:var(--surface2)}
.mc.playing{border-color:var(--red);animation:livePulse 2s infinite}
.mc.completed{border-color:#0f2e1a}
@keyframes livePulse{0%,100%{border-color:var(--red)}50%{border-color:#7f1d1d}}

.match-teams{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;font-weight:700}
.match-meta{font-size:9.5px;color:var(--faint);margin-top:5px;display:flex;gap:8px}
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:5px;font-size:9.5px;font-weight:700}
.b-live{background:var(--red-bg);color:var(--red)}
.b-done{background:var(--green-bg);color:var(--green)}
.b-pending{background:var(--surface2);color:var(--muted)}

/* Error */
.err-msg{background:var(--red-bg);border:1px solid var(--red-d);border-radius:8px;padding:10px;font-size:11px;color:var(--red);margin-bottom:10px;display:none}
</style>
</head>
<body>
<div id="app">

  <!-- Top Bar -->
  <div id="topbar">
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:18px">⚡</span>
      <h1>XURA — الحكام</h1>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="r-badge" id="ref-badge">تسجيل الدخول</span>
      <button class="btn btn-ghost btn-sm" id="btn-logout" style="display:none" onclick="doLogout()">خروج</button>
    </div>
  </div>

  <div id="screens">

    <!-- LOGIN SCREEN -->
    <div class="screen active" id="scr-login">
      <div style="display:flex;flex-direction:column;justify-content:center;min-height:70vh;padding:10px">
        <div class="hero">
          <div style="font-size:40px;margin-bottom:8px">👨‍⚖️</div>
          <h2>دخول الحكام</h2>
          <p>أدخل اسمك وكلمة المرور للوصول إلى لوحة التحكيم</p>
        </div>
        <div class="card">
          <div id="login-err" class="err-msg">بيانات الدخول غير صحيحة</div>
          <div class="fg">
            <label class="fl">اسم الحكم</label>
            <input class="fi" id="inp-name" placeholder="أدخل الاسم..." autocomplete="off">
          </div>
          <div class="fg">
            <label class="fl">كلمة المرور</label>
            <input class="fi" type="password" id="inp-pass" placeholder="••••••" onkeydown="if(event.key==='Enter')doLogin()">
          </div>
          <button class="btn btn-primary btn-full" onclick="doLogin()" id="btn-login">دخول ⚡</button>
        </div>
        <div style="text-align:center;margin-top:12px">
          <a href="index.html" style="font-size:10px;color:var(--muted);text-decoration:none">← العودة للتطبيق الرئيسي</a>
        </div>
      </div>
    </div>

    <!-- MATCHES SCREEN -->
    <div class="screen" id="scr-matches">
      <div class="sec-title" style="margin-bottom:12px">
        <span>مباراياتي المخصصة</span>
        <button class="btn btn-ghost btn-sm" onclick="loadMatches()">🔄 تحديث</button>
      </div>
      <div id="matches-list">
        <div style="text-align:center;padding:40px;color:var(--muted);font-size:12px">جاري التحميل...</div>
      </div>
    </div>

    <!-- LIVE MATCH SCREEN -->
    <div class="screen" id="scr-live">
      <button class="btn btn-ghost btn-sm" onclick="backToMatches()" style="margin-bottom:10px">← رجوع</button>

      <!-- Sets Score -->
      <div class="sets-row" id="sets-display">
        <div class="set-box"><div class="set-num" id="sets-a">0</div><div class="set-lbl" id="team-a-sets-lbl">فريق أ</div></div>
        <div class="set-box" style="display:flex;align-items:center"><span style="color:var(--faint);font-size:14px">أشواط</span></div>
        <div class="set-box"><div class="set-num" id="sets-b">0</div><div class="set-lbl" id="team-b-sets-lbl">فريق ب</div></div>
      </div>

      <!-- Points Scoreboard -->
      <div class="scoreboard">
        <div class="team-col">
          <div class="team-name-lbl" id="board-name-a" style="color:var(--teal)">فريق أ</div>
          <div class="score-num" id="board-score-a">0</div>
          <button class="add-btn" id="btn-add-a" onclick="addPoint('A')"
            style="background:rgba(94,234,212,.1);border-color:var(--teal);color:var(--teal)">＋</button>
          <button class="btn btn-ghost btn-sm" onclick="undoPoint('A')" style="margin-top:4px;width:100%">↩ تراجع</button>
        </div>
        <div class="score-divider">:</div>
        <div class="team-col">
          <div class="team-name-lbl" id="board-name-b" style="color:var(--amber)">فريق ب</div>
          <div class="score-num" id="board-score-b" style="color:var(--amber)">0</div>
          <button class="add-btn" id="btn-add-b" onclick="addPoint('B')"
            style="background:rgba(245,158,11,.1);border-color:var(--amber);color:var(--amber)">＋</button>
          <button class="btn btn-ghost btn-sm" onclick="undoPoint('B')" style="margin-top:4px;width:100%">↩ تراجع</button>
        </div>
      </div>

      <!-- Set info -->
      <div class="card-sm" style="text-align:center;margin-bottom:10px">
        <div style="font-size:10px;color:var(--muted)">الشوط الحالي</div>
        <div id="set-info" style="font-size:16px;font-weight:900;color:var(--amber)">الشوط 1 / 25 نقطة</div>
        <div id="serving-info" style="font-size:10px;color:var(--teal);margin-top:3px">الإرسال: —</div>
        <div id="sync-status" style="font-size:9px;color:var(--faint);margin-top:3px">●</div>
      </div>

      <!-- End Set / Match -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
        <button class="btn btn-amber" onclick="endSet()">إنهاء الشوط ▸</button>
        <button class="btn btn-red" onclick="endMatch()">إنهاء المباراة ✓</button>
      </div>

      <!-- Event Log -->
      <div class="sec-title"><span>سجل الأحداث</span></div>
      <div class="card" style="padding:8px;max-height:180px;overflow-y:auto">
        <div id="event-log"></div>
      </div>
    </div>

  </div>
</div>

<div id="toast"></div>

<script type="module" src="js/referee-engine.js"></script>
</body>
</html>
